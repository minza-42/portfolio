name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18"

      - name: Install deps & build (if present)
        run: |
          if [ -f package.json ] && grep -q '"build"' package.json; then
            echo "Found build script — installing and building"
            npm ci
            npm run build
          else
            echo "No build script found — skipping build"
          fi

      - name: Prepare public directory
        run: |
          rm -rf public
          # Prefer common build output folders
          if [ -d build ]; then
            cp -r build public
          elif [ -d dist ]; then
            cp -r dist public
          elif [ -d public ]; then
            echo "public directory already exists"
          else
            mkdir public
            rsync -av \
              --exclude='.git' \
              --exclude='.github' \
              --exclude='node_modules' \
              --exclude='public' \
              . public
          fi

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - id: deployment
        uses: actions/deploy-pages@v4
